<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MLRIT Model UN</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.95);
      width: 500px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
    }

    h2 {
      text-align: center;
      color: #002147;
      margin-bottom: 25px;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #34495e;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.3s;
      box-sizing: border-box;
      background: #f8f9fa;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #002147 0%, #0056b3 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 33, 71, 0.3);
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }

    .committee-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .committee-option {
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .committee-option.selected {
      border-color: #002147;
      background: #002147;
      color: white;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Register for MLRIT Model United Nations</h2>
    <form id="munForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="fullName" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" required>
      </div>

      <div class="form-group">
        <label>Department</label>
        <input type="text" name="department" required>
      </div>

      <div class="form-group">
        <label>Year of Study</label>
        <select name="year" required>
          <option value="">Select Year</option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>
      </div>

      <div class="form-group">
        <label>UN Committee Preference</label>
        <select name="committee" required>
          <option value="">Select Committee</option>
          <option value="unsc">UN Security Council (UNSC)</option>
          <option value="who">World Health Organization (WHO)</option>
          <option value="unicef">UNICEF</option>
          <option value="environment">UN Environment Programme</option>
          <option value="hrc">Human Rights Council</option>
        </select>
      </div>

      <div class="form-group">
        <label>Country Preference</label>
        <input type="text" name="country" placeholder="e.g., United States, India, France" required>
      </div>

      <div class="form-group">
        <label>Previous MUN Experience</label>
        <select name="experience">
          <option value="none">No Experience</option>
          <option value="beginner">Beginner (1-2 MUNs)</option>
          <option value="intermediate">Intermediate (3-5 MUNs)</option>
          <option value="advanced">Advanced (5+ MUNs)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Special Requirements</label>
        <textarea name="requirements" rows="3" placeholder="Dietary restrictions, accessibility needs, etc."></textarea>
      </div>

      <button type="submit">Register for MUN</button>
    </form>

    <div class="back-link">
      <a href="events.html">← Back to Events</a>
    </div>
  </div>

  <script>
    document.getElementById('munForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const formData = new FormData(this);
      const registrationData = {
        eventType: 'mun',
        fullName: formData.get('fullName'),
        email: formData.get('email'),
        phone: formData.get('phone'),
        department: formData.get('department'),
        year: formData.get('year'),
        committee: formData.get('committee'),
        country: formData.get('country'),
        experience: formData.get('experience'),
        requirements: formData.get('requirements'),
        timestamp: new Date().toLocaleString()
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(registrationData)
        });

        const result = await response.json();

        if (result.success) {
          alert('✅ Successfully registered for MLRIT Model United Nations!');
          this.reset();
        } else {
          alert('❌ Registration failed. Please try again.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('❌ Registration failed. Please check your connection.');
      }
    });
  </script>
</body>
</html>
