<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Sports Meet</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.95);
      width: 500px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
    }

    h2 {
      text-align: center;
      color: #e74c3c;
      margin-bottom: 25px;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #34495e;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.3s;
      box-sizing: border-box;
      background: #f8f9fa;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #e74c3c;
      background: white;
      box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3);
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #e74c3c;
      text-decoration: none;
      font-weight: 500;
    }

    .sport-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .sport-option {
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .sport-option.selected {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Register for Sports Meet 2025</h2>
    <form id="sportsForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="fullName" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" required>
      </div>

      <div class="form-group">
        <label>Department</label>
        <input type="text" name="department" required>
      </div>

      <div class="form-group">
        <label>Year of Study</label>
        <select name="year" required>
          <option value="">Select Year</option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>
      </div>

      <div class="form-group">
        <label>Sports Category</label>
        <select name="sportCategory" required>
          <option value="">Select Sport</option>
          <option value="cricket">Cricket</option>
          <option value="football">Football</option>
          <option value="basketball">Basketball</option>
          <option value="volleyball">Volleyball</option>
          <option value="badminton">Badminton</option>
          <option value="table_tennis">Table Tennis</option>
          <option value="athletics">Athletics (Track & Field)</option>
          <option value="chess">Chess</option>
        </select>
      </div>

      <div class="form-group">
        <label>Participation Type</label>
        <select name="participationType" required>
          <option value="">Select Type</option>
          <option value="individual">Individual</option>
          <option value="team">Team</option>
        </select>
      </div>

      <div class="form-group">
        <label>Team Name (if team event)</label>
        <input type="text" name="teamName" placeholder="Enter your team name">
      </div>

      <div class="form-group">
        <label>Team Members (if team event)</label>
        <textarea name="teamMembers" rows="3" placeholder="Enter names of team members separated by commas"></textarea>
      </div>

      <div class="form-group">
        <label>Previous Sports Experience</label>
        <select name="experience">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
          <option value="professional">Professional Level</option>
        </select>
      </div>

      <div class="form-group">
        <label>Medical Conditions (if any)</label>
        <input type="text" name="medicalConditions" placeholder="Any health issues we should know about">
      </div>

      <button type="submit">Register for Sports Meet</button>
    </form>

    <div class="back-link">
      <a href="events.html">← Back to Events</a>
    </div>
  </div>

  <script>
    document.getElementById('sportsForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const formData = new FormData(this);
      const registrationData = {
        eventType: 'sports_meet',
        fullName: formData.get('fullName'),
        email: formData.get('email'),
        phone: formData.get('phone'),
        department: formData.get('department'),
        year: formData.get('year'),
        sportCategory: formData.get('sportCategory'),
        participationType: formData.get('participationType'),
        teamName: formData.get('teamName'),
        teamMembers: formData.get('teamMembers'),
        experience: formData.get('experience'),
        medicalConditions: formData.get('medicalConditions'),
        timestamp: new Date().toLocaleString()
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(registrationData)
        });

        const result = await response.json();

        if (result.success) {
          alert('✅ Successfully registered for Sports Meet 2025!');
          this.reset();
        } else {
          alert('❌ Registration failed. Please try again.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('❌ Registration failed. Please check your connection.');
      }
    });
  </script>
</body>
</html>
