<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Alumni Meet</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: #fff8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .form-container {
      background: white;
      width: 400px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #8e44ad;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #34495e;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ecf0f1;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      border-color: #9b59b6;
      outline: none;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #8e44ad;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #732d91;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
    }
    .back-link a {
      color: #9b59b6;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Register for Alumni Meet 2025</h2>
    <form id="alumniForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="fullName" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" name="phone" required>
      </div>
      <div class="form-group">
        <label>Graduation Year</label>
        <input type="number" name="graduationYear" min="2000" max="2025" required>
      </div>
      <div class="form-group">
        <label>Department</label>
        <input type="text" name="department" required>
      </div>
      <div class="form-group">
        <label>Current Company/Profession</label>
        <input type="text" name="profession" required>
      </div>
      <div class="form-group">
        <label>Number of Guests</label>
        <select name="guests" required>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div class="form-group">
        <label>Special Requirements</label>
        <input type="text" name="requirements" placeholder="Dietary, accessibility, etc.">
      </div>
      <button type="submit">Register for Alumni Meet</button>
    </form>
    <div class="back-link">
      <a href="events.html">← Back to Events</a>
    </div>
  </div>

  <script>
    document.getElementById('alumniForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const formData = new FormData(this);
      const registrationData = {
        eventType: 'alumni_meet',
        fullName: formData.get('fullName'),
        email: formData.get('email'),
        phone: formData.get('phone'),
        graduationYear: formData.get('graduationYear'),
        department: formData.get('department'),
        profession: formData.get('profession'),
        guests: formData.get('guests'),
        requirements: formData.get('requirements'),
        timestamp: new Date().toLocaleString()
      };

      try {
        const response = await fetch('http://localhost:3000/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(registrationData)
        });

        const result = await response.json();

        if (result.success) {
          alert('✅ Successfully registered for Alumni Meet 2025!');
          this.reset();
        } else {
          alert('❌ Registration failed. Please try again.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('❌ Registration failed. Please check your connection.');
      }
    });
  </script>
</body>
</html>
